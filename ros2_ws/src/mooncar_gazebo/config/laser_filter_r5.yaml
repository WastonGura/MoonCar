scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: rover_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_footprint
        # Model envelope plus clearance, not measured hardware dimensions.
        # Collision half-length/width: 0.233/0.19055 m; visual wheel caps reach 0.20055 m.
        min_x: -0.25
        max_x: 0.25
        min_y: -0.22
        max_y: 0.22
        min_z: -0.1
        max_z: 0.8
        invert: false
