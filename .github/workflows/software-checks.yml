name: Software checks
on:
  pull_request:
    branches: [main, dev/terrain-mapping-workbench]
  push:
    branches: [main, dev/terrain-mapping-workbench]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc \
            python3-numpy \
            python3-scipy \
            python3-opencv \
            python3-pil \
            python3-yaml \
            python3-matplotlib \
            python3-serial \
            ros-jazzy-lifecycle-msgs \
            ros-jazzy-nav2-msgs \
            ros-jazzy-diagnostic-msgs
      - name: Python and portable firmware checks
        shell: bash
        run: scripts/check_software.sh
      - name: Validate script syntax
        shell: bash
        run: |
          python3 -m compileall -q ros2_ws/src scripts tests
          for script in scripts/*.sh; do bash -n "$script"; done
